<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>横瀬町エネルギー資源・ハザード3層マップ</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    html,
    body,
    #map {
      height: 100%;
      margin: 0;
    }

    .app-title {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid #cbd5e1;
      padding: 10px 12px;
      max-width: 360px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.18);
    }

    .app-title h1 {
      margin: 0;
      font-size: 15px;
      line-height: 1.35;
      color: #0f172a;
    }

    .app-title p {
      margin: 4px 0 0;
      font-size: 12px;
      line-height: 1.45;
      color: #475569;
    }

    .legend {
      position: absolute;
      left: 12px;
      bottom: 18px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid #cbd5e1;
      padding: 10px 12px;
      font: 12px/1.4 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #334155;
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.18);
    }

    .legend-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
    }

    .swatch {
      width: 18px;
      height: 12px;
      border: 1px solid rgba(15, 23, 42, 0.35);
    }

    .swatch-hazard {
      background: rgba(220, 38, 38, 0.4);
    }

    .swatch-solar {
      background: rgba(250, 204, 21, 0.72);
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="app-title">
    <h1>横瀬町エネルギー資源・ハザード3層マップ</h1>
    <p>ベースマップ、土砂災害警戒区域、OAM/設備ポリゴンを明示的なPaneで重ねています。</p>
  </div>

  <div class="legend">
    <strong>レイヤー構造</strong>
    <div class="legend-row"><span class="swatch swatch-hazard"></span><span>土砂災害警戒区域 opacity 0.4</span></div>
    <div class="legend-row"><span class="swatch swatch-solar"></span><span>設備ポリゴン / OAM</span></div>
  </div>

  <script>
    const map = L.map("map", {
      center: [35.9847, 139.0828],
      zoom: 13,
      zoomControl: true
    });

    // Pane order is fixed. Re-adding overlays will keep the same stacking order.
    map.createPane("basemapPane");
    map.createPane("hazardPane");
    map.createPane("oamPane");
    map.createPane("assetPane");

    map.getPane("basemapPane").style.zIndex = 200;
    map.getPane("hazardPane").style.zIndex = 400;
    map.getPane("oamPane").style.zIndex = 500;
    map.getPane("assetPane").style.zIndex = 650;

    map.getPane("hazardPane").style.pointerEvents = "none";
    map.getPane("oamPane").style.pointerEvents = "none";

    const baseMaps = {
      "OpenStreetMap": L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        pane: "basemapPane",
        maxZoom: 19,
        attribution: "&copy; OpenStreetMap contributors"
      }),
      "国土地理院 標準地図": L.tileLayer("https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png", {
        pane: "basemapPane",
        maxZoom: 18,
        attribution: "地理院タイル"
      }),
      "Esri World Imagery": L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
        pane: "basemapPane",
        maxZoom: 19,
        attribution: "Tiles &copy; Esri"
      })
    };

    baseMaps["OpenStreetMap"].addTo(map);

    const hazardDosya = L.tileLayer(
      "https://disaportaldata.gsi.go.jp/raster/05_dosyakigaikukuyiki/{z}/{x}/{y}.png",
      {
        pane: "hazardPane",
        opacity: 0.4,
        maxZoom: 18,
        attribution: "ハザード情報: 国土地理院 重ねるハザードマップ"
      }
    );

    const oamOrtho = L.tileLayer(
      "https://tiles.openaerialmap.org/62aeecdea896280006b0a6d6/0/62aeecdea896280006b0a6d7/{z}/{x}/{y}",
      {
        pane: "oamPane",
        opacity: 0.65,
        maxZoom: 20,
        attribution: "OpenAerialMap / Open Imagery Network"
      }
    );

    const solarPolygons = L.geoJSON(null, {
      pane: "assetPane",
      style: {
        color: "#a16207",
        weight: 1,
        fillColor: "#facc15",
        fillOpacity: 0.72
      },
      onEachFeature: (feature, layer) => {
        const p = feature.properties || {};
        layer.bindPopup(`
          <strong>${escapeHtml(p.id || "solar panel")}</strong><br>
          面積: ${escapeHtml(p.calc_area_m2 || "未計算")} m²<br>
          推計容量: ${escapeHtml(p.calc_capacity_kw || "未計算")} kW<br>
          年間想定発電量: ${escapeHtml(p.calc_annual_kwh || "未計算")} kWh<br>
          <small>${escapeHtml(p.matched_query_tags || "")}</small>
        `);
      }
    });

    const energyAssets = L.geoJSON(null, {
      pane: "assetPane",
      pointToLayer: (feature, latlng) => {
        const readiness = feature.properties?.readiness || "?";
        return L.circleMarker(latlng, {
          radius: 7,
          color: "#ffffff",
          weight: 2,
          fillColor: readinessColor(readiness),
          fillOpacity: 0.95
        });
      },
      onEachFeature: (feature, layer) => {
        const p = feature.properties || {};
        layer.bindPopup(`
          <strong>${escapeHtml(p.name || "energy asset")}</strong><br>
          種別: ${escapeHtml(p.resource_type || "未分類")}<br>
          地域利用可能性: <strong>${escapeHtml(p.readiness || "?")}</strong><br>
          データ確度: ${escapeHtml(p.confidence || "unknown")}<br>
          <small>${escapeHtml(p.next_check || "")}</small>
        `);
      }
    });

    const overlays = {
      "土砂災害警戒区域": hazardDosya,
      "OAM 独自オルソ画像": oamOrtho,
      "太陽光設備ポリゴン": solarPolygons,
      "地域エネルギー資源候補": energyAssets
    };

    hazardDosya.addTo(map);
    solarPolygons.addTo(map);
    energyAssets.addTo(map);

    L.control.layers(baseMaps, overlays, {
      position: "topright",
      collapsed: false
    }).addTo(map);

    Promise.all([
      fetch("./data/yokoze_boundary.geojson").then((res) => res.json()),
      fetch("./data/yokoze_solar_panels.geojson").then((res) => res.json()),
      fetch("./data/yokoze_energy_assets_sample.geojson").then((res) => res.json())
    ]).then(([boundary, solar, assets]) => {
      L.geoJSON(boundary, {
        pane: "assetPane",
        style: {
          color: "#0f766e",
          weight: 2,
          fillOpacity: 0
        }
      }).addTo(map);

      solarPolygons.addData(solar);
      energyAssets.addData(assets);
    }).catch((error) => {
      console.error(error);
      alert("GeoJSONの読み込みに失敗しました。HTTPサーバー経由で開いてください。");
    });

    function readinessColor(readiness) {
      if (readiness === "A") return "#15803d";
      if (readiness === "B") return "#2563eb";
      if (readiness === "C") return "#f59e0b";
      if (readiness === "D") return "#b91c1c";
      return "#64748b";
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }
  </script>
</body>
</html>
